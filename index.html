<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shaadi Planner</title>
<meta name="description" content="Wedding money, tasks and guests — for the whole family">
<meta name="theme-color" content="#8c1c3a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="शादी प्लानर">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<style>
:root{
  --bg:#fbf6ee; --card:#ffffff; --ink:#2b1d1a; --muted:#76665e; --line:#ecdfd0;
  --maroon:#8c1c3a; --maroon-2:#6e1430; --maroon-soft:#fbe9ee;
  --gold:#e8a020; --gold-soft:#fff3da; --gold-ink:#7a4d00;
  --green:#2c7a4b; --green-soft:#e5f4ea; --red:#b83227; --red-soft:#fdeceb;
  --due:#f0c35a;
  --r:18px; --shadow:0 1px 2px rgba(60,30,20,.06),0 4px 14px rgba(60,30,20,.06);
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Mukta',system-ui,sans-serif;line-height:1.4;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
i.ph,i.ph-fill{line-height:1;vertical-align:-0.12em}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:rgba(251,246,238,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:56px}
.top h1{font-size:1.05rem;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;font-weight:600;padding:3px 10px;border-radius:99px;
  background:var(--gold-soft);color:var(--gold-ink);white-space:nowrap}
.chip.grey{background:#f1ebe4;color:var(--muted)}
.chip.red{background:var(--red-soft);color:var(--red)}
.chip.green{background:var(--green-soft);color:var(--green)}
.demo-bar{background:var(--gold-soft);color:var(--gold-ink);font-size:.78rem;text-align:center;padding:4px 12px;font-weight:600}

main{padding:14px 0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom))}
main.no-nav{padding-bottom:40px}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;height:var(--nav-h)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--muted);
  font-size:.78rem;font-weight:600}
.nav button i{font-size:1.6rem}
.nav button.on{color:var(--maroon)}

/* ---------- cards & lists ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 8px}
.sec-h h2{font-size:1rem;margin:0;font-weight:700}
.link{color:var(--maroon);font-weight:600;font-size:.85rem}
.muted{color:var(--muted)}
.small{font-size:.8rem}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:.92rem}

.hero{background:linear-gradient(135deg,var(--maroon),var(--maroon-2));color:#fff;border-radius:22px;padding:18px 18px 16px;
  margin-bottom:14px;position:relative;overflow:hidden;box-shadow:0 6px 22px rgba(140,28,58,.25)}
.hero::after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;
  border:14px dotted rgba(232,160,32,.35)}
.hero .nm{font-size:1.25rem;font-weight:700;position:relative;z-index:1}
.hero .dt{opacity:.85;font-size:.88rem;position:relative;z-index:1}
.hero .cd{margin-top:8px;display:inline-block;background:rgba(255,255,255,.14);color:#ffe2a6;font-weight:700;
  padding:4px 12px;border-radius:99px;font-size:.95rem;position:relative;z-index:1}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}
.stat .lb{font-size:.82rem;color:var(--muted);font-weight:600}
.stat .v{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.stat .w{font-size:.78rem;color:var(--muted)}
.stat.due .v{color:var(--red)}
.stat.full{grid-column:1/-1}
.bar{height:12px;border-radius:99px;background:#f1e8de;overflow:hidden;display:flex;margin-top:10px}
.bar > span{height:100%}
.bar .p{background:var(--maroon)} .bar .d{background:repeating-linear-gradient(45deg,var(--due),var(--due) 5px,#f6d58a 5px,#f6d58a 10px)}
.bar.over .p{background:var(--red)}
.bar.thin{height:8px;margin-top:8px}
.legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 6px}
.big-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:96px;border-radius:var(--r);
  font-weight:700;font-size:1.02rem;box-shadow:var(--shadow);background:#fff;color:var(--ink)}
.big-btn i{font-size:2rem}
.big-btn.primary{background:var(--gold);color:#3b2400}
.big-btn:active{transform:scale(.98)}

.list{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;
  align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.row .ic.gold{background:var(--gold-soft);color:var(--gold-ink)}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{font-weight:700;white-space:nowrap;text-align:right}
.row .amt .s{text-align:right}
.day-h{font-size:.78rem;font-weight:700;color:var(--muted);padding:12px 14px 4px;background:#fcf9f4;border-bottom:1px solid var(--line)}

.seg{display:flex;background:#efe6db;border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 6px;border-radius:11px;font-weight:600;color:var(--muted);font-size:.92rem}
.seg button.on{background:#fff;color:var(--maroon);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.filters{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{flex:none;padding:6px 14px;border-radius:99px;background:#fff;border:1px solid var(--line);font-size:.85rem;font-weight:600;color:var(--muted)}
.pill.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.searchbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:10px}
.searchbox input{border:0;outline:0;flex:1;padding:11px 0;background:transparent;min-width:0}
.total-line{display:flex;justify-content:space-between;font-weight:700;padding:4px 4px 10px;font-size:.92rem}

.vcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px;width:100%;text-align:left;display:block}
.vcard .top-l{display:flex;align-items:center;gap:12px}
.vcard .nums{display:flex;justify-content:space-between;font-size:.85rem;margin-top:8px}
.vcard .nums b{font-size:.95rem}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));z-index:19;
  background:var(--gold);color:#3b2400;border-radius:99px;padding:14px 20px;font-weight:700;display:flex;align-items:center;gap:8px;
  box-shadow:0 6px 18px rgba(232,160,32,.45);font-size:1rem}
.fab i{font-size:1.3rem}

/* ---------- buttons & forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 20px;border-radius:14px;font-weight:700;font-size:1rem;
  background:var(--maroon);color:#fff;min-height:52px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--maroon);border:1.5px solid var(--line)}
.btn.gold{background:var(--gold);color:#3b2400}
.btn.danger{background:#fff;color:var(--red);border:1.5px solid #f2cdc9}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.88rem;border-radius:12px}
.btn:disabled{opacity:.55}
.btns{display:flex;gap:10px;margin-top:18px}
.btns .btn{flex:1}

.field{margin-bottom:16px}
.field > label,.lbl{display:block;font-weight:600;font-size:.9rem;margin-bottom:6px}
.field .hint{font-size:.78rem;color:var(--muted);margin-top:4px}
.inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;outline:0;font-size:1rem;min-height:52px}
.inp:focus{border-color:var(--maroon)}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}
.amt-inp{font-size:2rem;font-weight:800;padding:10px 14px;text-align:left;letter-spacing:.01em}
.amt-words{font-size:.88rem;color:var(--maroon);font-weight:600;min-height:1.3em;margin-top:4px}
.err{color:var(--red);font-size:.85rem;font-weight:600;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:.92rem;min-height:42px}
.chips button.on{background:var(--maroon-soft);border-color:var(--maroon);color:var(--maroon)}
.chips button.add{border-style:dashed;color:var(--muted)}
details.more{margin:6px 0 14px}
details.more summary{cursor:pointer;color:var(--maroon);font-weight:600;font-size:.92rem;list-style:none;padding:6px 0}
details.more summary::-webkit-details-marker{display:none}
details.more[open] summary{margin-bottom:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;padding:8px 0}
.check input{width:22px;height:22px;accent-color:var(--maroon)}

/* ---------- sheet (bottom drawer) ---------- */
.scrim{position:fixed;inset:0;background:rgba(30,15,10,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center;
  animation:fade .15s ease}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:94vh;max-height:94dvh;overflow:auto;border-radius:24px 24px 0 0;
  padding:8px 18px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#dccfc0;margin:4px auto 10px}
.sheet .sh-h{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sheet .sh-h h3{flex:1;margin:0;font-size:1.2rem}
.x{width:40px;height:40px;border-radius:50%;background:#efe6db;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---------- toast ---------- */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));z-index:60;
  background:#2b1d1a;color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:16px;align-items:center;font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);animation:fade .15s}
.toast button{color:#ffcf6e;font-weight:700}

/* ---------- full screens (sign-in, onboarding) ---------- */
.screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:32px 0}
.brand{text-align:center;margin-bottom:28px}
.brand .logo{width:84px;height:84px;margin:0 auto 12px;display:block}
.brand h1{font-size:1.8rem;margin:0;color:var(--maroon);font-weight:800}
.brand p{margin:4px 0 0;color:var(--muted)}
.lang-big{display:grid;gap:12px}
.lang-big button{background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px;font-size:1.3rem;font-weight:700;box-shadow:var(--shadow)}
.lang-big button:active{border-color:var(--maroon)}
.lang-toggle{display:flex;justify-content:center;gap:6px;margin-top:18px}
.lang-toggle button{padding:6px 14px;border-radius:99px;font-weight:600;color:var(--muted);font-size:.9rem}
.lang-toggle button.on{background:var(--maroon-soft);color:var(--maroon)}
/* ---------- tasks ---------- */
.ic-c{width:40px;height:40px;border-radius:12px;background:var(--maroon-soft);color:var(--maroon);display:flex;align-items:center;justify-content:center;font-size:1.25rem;flex:none}
.fn-h{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;background:#fcf9f4;border-bottom:1px solid var(--line)}
.fn-h .mid,.trow .tmain{flex:1;min-width:0}
.fn-h .t{font-weight:700}
.fn-h .s,.trow .s{font-size:.8rem;color:var(--muted)}
.prog{height:6px;border-radius:99px;background:#efe4d6;overflow:hidden;margin-top:6px}
.prog span{display:block;height:100%;background:var(--green)}
.trow{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .tmain{text-align:left;padding:11px 14px 11px 0}
.trow .t{font-weight:600}
.trow.done .t{text-decoration:line-through;color:var(--muted);font-weight:500}
.tick{flex:none;width:54px;align-self:stretch;display:flex;align-items:center;justify-content:center}
.tick > span{width:28px;height:28px;border-radius:50%;border:2px solid #cdb9a4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1rem;background:#fff}
.tick.on > span{background:var(--green);border-color:var(--green)}
.add-row{display:flex;align-items:center;gap:6px;width:100%;padding:12px 14px;color:var(--maroon);font-weight:600;font-size:.9rem;border-bottom:1px solid var(--line);text-align:left}
.add-row:last-child{border-bottom:0}
.add-row.muted{color:var(--muted)}
.fn-strip{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.fn-strip::-webkit-scrollbar{display:none}
.fn-chip{flex:none;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:10px 14px;min-width:118px;text-align:left}
.fn-chip .n{font-weight:700;white-space:nowrap}
.fn-chip .n i{color:var(--maroon)}
.fn-chip .d{font-size:.78rem;color:var(--muted)}
.fn-chip .c{font-size:.82rem;font-weight:700;color:var(--gold-ink)}
/* ---------- install ---------- */
.install{display:flex;align-items:center;gap:12px;background:#fff;border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;border:1.5px solid var(--gold-soft)}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install .mid{flex:1;min-width:0}
.install .t{font-weight:700}
.install .s{font-size:.8rem;color:var(--muted)}
.steps{margin:0 0 14px;padding-left:22px}
.steps li{margin-bottom:10px;line-height:1.45}
.chips.mini{gap:6px}
.chips.mini button{min-height:34px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.rc img{display:block;max-width:100%;max-height:240px;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
/* ---------- guests & shagun ---------- */
.row .ic.green{background:var(--green-soft);color:var(--green)}
.row .avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .inp{text-align:center;font-weight:700;font-size:1.15rem;padding:10px 4px;min-width:0}
.stepper button{flex:none;width:48px;height:52px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-size:1.2rem;color:var(--maroon)}
.field.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big-btn .small{font-size:.8rem}

.member{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--gold-soft);color:var(--gold-ink);display:flex;align-items:center;
  justify-content:center;font-weight:800;flex:none}
.member .mid{flex:1;min-width:0}
.member .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.linkbox{background:#fff;border:1.5px dashed var(--gold);border-radius:14px;padding:12px;word-break:break-all;font-size:.85rem;margin:8px 0 12px}
.menu-row{display:flex;align-items:center;gap:12px;padding:15px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;font-weight:600}
.menu-row:last-child{border-bottom:0}
.menu-row i{font-size:1.3rem;color:var(--maroon)}
.menu-row .r{margin-left:auto;color:var(--muted);font-weight:500;font-size:.85rem}
.spin{display:inline-block;width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--maroon);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="screen"><div class="wrap" style="text-align:center"><span class="spin"></span></div></div></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>
<script type="module" src="app.js"></script>
</body>
</html>
